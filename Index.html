<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Finder Québec</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f3f3f3;
}

header {
  background: #131921;
  padding: 15px;
  text-align: center;
  color: white;
}

input {
  width: 80%;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px;
  border: none;
  background: orange;
  cursor: pointer;
  border-radius: 6px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  max-width: 100%;
  height: 120px;
  object-fit: contain;
}

.price {
  color: green;
  font-weight: bold;
  margin: 5px 0;
}

.best {
  border: 2px solid gold;
}
</style>
</head>
<body>

<header>
  <h2>🔎 Deal Finder Québec</h2>
  <input type="text" id="search" placeholder="Ex: phone">
  <button onclick="searchProduct()">Rechercher</button>
</header>

<div class="products" id="products"></div>

<script>
async function searchProduct() {
  const query = document.getElementById("search").value;
  const container = document.getElementById("products");

  if (!query) return;

  const response = await fetch(`https://dummyjson.com/products/search?q=${query}`);
  const data = await response.json();

  const products = data.products.sort((a,b)=>a.price-b.price);

  container.innerHTML = "";

  products.forEach((product, index) => {
    container.innerHTML += `
      <div class="card ${index===0 ? 'best' : ''}">
        <img src="${product.thumbnail}">
        <h4>${product.title}</h4>
        <div class="price">$${product.price} CAD</div>
        <button onclick="window.open('https://www.amazon.ca/s?k=${product.title}','_blank')">
          Voir l’offre
        </button>
      </div>
    `;
  });
}
</script>

</body>
</html>
